name: Multi-Source AI Job Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "17 1 * * *"
      timezone: "Asia/Kolkata"
    - cron: "17 7 * * *"
      timezone: "Asia/Kolkata"
    - cron: "17 13 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run AI Job Agent
      - name: Run agent
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          python -m app.main
      # 5. Save job database
      - name: Commit database
        run: |
          git config user.name "AI Job Agent"
          git config user.email "actions@github.com"

          if [ -f data/jobs.db ]; then
            git add -f data/jobs.db
            if git diff --cached --quiet; then
              echo "No database changes to commit."
            else
              git commit -m "Update job database"
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo "No database file yet — no jobs matched this run's filters."
          fi
         
